<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grant Laboratory - Contact Us</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    header {
      position: relative;
      z-index: 10;
      background: #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-link {
      display: inline-block;
    }
    .header-logo {
      mix-blend-mode: screen;
      height: 85px;
      width: auto;
      display: block;
    }
    .location-text {
      font-size: 0.55rem;
      color: #777;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: -2px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    nav {
      display: flex;
      gap: 1.5rem;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
    }
    nav a:hover, nav a.active {
      color: #d4af37;
    }
    .header-hero {
      height: 40px;
      width: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #d4af37;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <a href="index.html" class="logo-link">
        <img src="images/logo.jpg" alt="Grant Laboratory Logo" class="header-logo">
      </a>
      <span class="location-text">Based in Tampa, Florida</span>
    </div>

    <div class="header-right">
      <nav>
        <a href="index.html">Home</a>
        <a href="what-we-do.html">What We Do</a>
        <a href="tips.html">Tips & Templates</a>
        <a href="contact.html" class="active">Contact Us</a>
      </nav>
      <a href="https://www.linkedin.com/in/jacobresnick/" target="_blank">
        <img src="images/hero.jpg" alt="Grant Laboratory Scientist" class="header-hero">
      </a>
    </div>
  </header>

  <main class="container">
    <div class="text-side">
      <div class="contact-card">
        <iframe 
          src="https://docs.google.com/forms/d/e/1FAIpQLScSPWLJU9oXAaB8J2nwa9f8tTF8xL7QEx0ldgChYCS6VkZopg/viewform?embedded=true" 
          width="100%" 
          height="783" 
          frameborder="0" 
          marginheight="0" 
          marginwidth="0"
          style="border: none; border-radius: 12px; background: #ffffff;">
          Loading…
        </iframe>
      </div>
    </div>
  </main>
</body>
</html>
